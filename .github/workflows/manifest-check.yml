name: GhostOS manifest and GhostMode check

on:
  push:
    branches:
      - main
      - 'feature/ghostmode-*'
      - 'feature/universal-gsi-larry'
      - 'fix/ghostmode-*'
    paths:
      - 'manifests/**'
      - 'scripts/**'
      - 'ghostos/ghostmode/**'
      - 'tests/**'
      - 'docs/GHOSTMODE-IMPLEMENTATION.md'
      - 'docs/UNIVERSAL-CHECKPOINT.md'
      - 'device/ghostos/**'
      - 'vendor/ghostos/**'
      - 'packages/apps/GhostOSPrivacyCenter/**'
      - 'packages/apps/GhostOSSecurityCenter/**'
      - '.github/workflows/manifest-check.yml'
  pull_request:
    branches:
      - main
      - 'feature/universal-gsi-larry'
    paths:
      - 'manifests/**'
      - 'scripts/**'
      - 'ghostos/ghostmode/**'
      - 'tests/**'
      - 'docs/GHOSTMODE-IMPLEMENTATION.md'
      - 'docs/UNIVERSAL-CHECKPOINT.md'
      - 'device/ghostos/**'
      - 'vendor/ghostos/**'
      - 'packages/apps/GhostOSPrivacyCenter/**'
      - 'packages/apps/GhostOSSecurityCenter/**'
      - '.github/workflows/manifest-check.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android 17 API 37 and build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Link Privacy Center Android resources and compile sources against API 37
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$ANDROID_HOME/platforms/android-37.0/android.jar"
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          test -f "$android_jar" || { echo "::error::Android API 37 android.jar is missing"; exit 1; }
          test -x "$aapt2" || { echo "::error::Android 17 build-tools aapt2 is missing"; exit 1; }
          mkdir -p build/android-generated build/android-classes
          "$aapt2" compile --dir packages/apps/GhostOSPrivacyCenter/res -o build/ghostos-privacy-resources.zip
          "$aapt2" link \
            -o build/ghostos-privacy-center-res.apk \
            --manifest packages/apps/GhostOSPrivacyCenter/AndroidManifest.xml \
            -I "$android_jar" \
            --min-sdk-version 29 \
            --target-sdk-version 37 \
            --java build/android-generated \
            build/ghostos-privacy-resources.zip
          test -f build/android-generated/org/ghostos/privacy/R.java \
            || { echo "::error::aapt2 did not generate the Privacy Center R.java"; exit 1; }
          javac --release 17 -classpath "$android_jar" -d build/android-classes \
            build/android-generated/org/ghostos/privacy/R.java \
            $(find packages/apps/GhostOSPrivacyCenter/src -type f -name '*.java' -print)
          test -f build/android-classes/org/ghostos/privacy/GhostModeQuickSettingsTile.class
          test -f build/android-classes/org/ghostos/privacy/GhostModeDevicePolicyAdapter.class
          test -f build/android-classes/org/ghostos/privacy/PrivacyActivity.class
          test -f build/android-classes/org/ghostos/privacy/GhostModeAndroidPolicyManager.class

      - name: Compile Security Center against Android 17 SDK
        shell: bash
        run: |
          set -euo pipefail
          android_jar="$ANDROID_HOME/platforms/android-37.0/android.jar"
          aapt2="$ANDROID_HOME/build-tools/37.0.0/aapt2"
          test -f "$android_jar"
          test -x "$aapt2"
          mkdir -p build/security-center/classes
          "$aapt2" link -o build/security-center/manifest-check.apk \
            --manifest packages/apps/GhostOSSecurityCenter/AndroidManifest.xml \
            -I "$android_jar" --min-sdk-version 31 --target-sdk-version 37
          javac --release 17 -classpath "$android_jar" \
            -d build/security-center/classes \
            $(find packages/apps/GhostOSSecurityCenter/src -type f -name '*.java' -print)
          test -f build/security-center/classes/org/ghostos/securitycenter/MainActivity.class
      - name: Keep GhostWeb VPN outside GhostOS product configuration
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'VpnHood|ghost-web-vpn' \
            device/ghostos vendor/ghostos packages/apps/GhostOSPrivacyCenter packages/apps/GhostOSSecurityCenter manifests; then
            echo "::error::GhostWeb VPN must remain outside GhostOS product configuration" >&2
            exit 1
          fi

      - name: Validate XML manifests
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          paths = (
              "manifests/ghostos-23.2.xml",
              "manifests/ghostos-24.0.xml",
              "manifests/ghostos_larry.xml",
              "packages/apps/GhostOSPrivacyCenter/AndroidManifest.xml",
              "packages/apps/GhostOSSecurityCenter/AndroidManifest.xml",
              "packages/apps/GhostOSPrivacyCenter/res/values/strings.xml",
              "packages/apps/GhostOSPrivacyCenter/res/values/styles.xml",
              "packages/apps/GhostOSPrivacyCenter/res/xml/device_admin.xml",
          )
          for path in paths:
              ET.parse(path)
              print(f"Valid XML: {path}")
          PY

      - name: Validate every pinned upstream project commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          for manifest_path in ("manifests/ghostos-23.2.xml", "manifests/ghostos-24.0.xml"):
              manifest = ET.parse(manifest_path).getroot()
              remotes = {item.attrib["name"]: item.attrib for item in manifest.findall("remote")}
              projects = manifest.findall("project")
              if not projects:
                  raise SystemExit(f"No upstream projects are declared in {manifest_path}")

              for project in projects:
                  name = project.attrib["name"]
                  remote_name = project.attrib["remote"]
                  remote = remotes.get(remote_name)
                  if remote is None or not remote.get("fetch"):
                      raise SystemExit(f"Missing fetch URL for manifest remote {remote_name}")
                  revision = project.get("revision") or remote.get("revision")
                  if not revision:
                      raise SystemExit(f"Missing revision for {name}")
                  if manifest_path == "manifests/ghostos-24.0.xml" and not re.fullmatch(r"[0-9a-fA-F]{40}", revision):
                      raise SystemExit(f"LineageOS 24.0 project {name} must be pinned to a full 40-character commit SHA")
                  owner = remote["fetch"].rstrip("/").split("/")[-1]
                  if re.fullmatch(r"[0-9a-fA-F]{40}", revision):
                      actual = subprocess.check_output(
                          ["gh", "api", f"repos/{owner}/{name}/commits/{revision}", "--jq", ".sha"],
                          text=True,
                      ).strip()
                      if actual.lower() != revision.lower():
                          raise SystemExit(f"Pinned commit mismatch for {owner}/{name}: {actual}")
                  else:
                      url = f"{remote['fetch'].rstrip('/')}/{name}.git"
                      subprocess.run(
                          ["git", "ls-remote", "--exit-code", "--heads", url, f"refs/heads/{revision}"],
                          check=True,
                          stdout=subprocess.DEVNULL,
                      )
                  print(f"Verified {owner}/{name}@{revision} ({manifest_path})")
          PY

      - name: Validate LineageOS 24.0 / Android 17 build script syntax
        run: bash -n scripts/ghostos-build.sh

      - name: Validate LineageOS 24.0 / Android 17 bootstrap script syntax
        run: bash -n scripts/init-android17.sh

      - name: Test Android 17 bootstrap path and pinned manifest handling
        run: bash tests/test_android17_bootstrap.sh

      - name: Test clean and partial checkout bootstrap
        run: bash tests/test_build_bootstrap.sh

      - name: Validate GhostMode policy files
        shell: bash
        run: |
          set -euo pipefail
          find ghostos/ghostmode -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Test GhostMode manager and rollback
        working-directory: ghostos/ghostmode
        run: python3 -m unittest -v test_manager.py

      - name: Test GhostMode partial rollback and recovery regression
        run: python3 -m unittest -v ghostos.ghostmode.test_rollback_recovery

      - name: Test GhostMode Android adapter contracts
        run: python3 -m unittest -v tests/test_ghostmode_android_adapters.py

      - name: Test GhostMode Privacy Center integration
        run: python3 -m unittest -v ghostos.ghostmode.test_privacy_center

      - name: Test GhostMode SystemUI integration
        run: python3 -m unittest -v ghostos.ghostmode.test_systemui

      - name: Test GhostMode Quick Settings tile declaration and fail-closed state
        run: python3 -m unittest -v tests/test_ghostos_quick_settings_tile.py

      - name: Test Android Device Owner policy adapter and resources
        run: python3 -m unittest -v tests/test_ghostmode_device_policy_adapter.py

      - name: Verify Security Center is installed in larry product
        run: grep -Fq "GhostOSSecurityCenter" vendor/ghostos/config/common.mk

      - name: Show supported devices
        run: grep -E 'android_device_oneplus_larry' manifests/ghostos-24.0.xml
